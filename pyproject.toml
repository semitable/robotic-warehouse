[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pgct"
version = "0.1.0"
description = "PGCT (Probe-Gated Critic Transfer): latent team identification from individual reward responses and selective critic access via Max-GAE; shared core plus RWARE and Overcooked experiments"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy", "torch", "gymnasium"]

[project.optional-dependencies]
test = ["pytest"]
rware = ["networkx", "pyglet<2", "wandb"]   # RWARE experiment (install RWARE/ itself with: pip install -e RWARE)
analysis = ["psutil", "matplotlib"]

# Installs the shared core (PGCT/pgct_core) and the Overcooked experiment package (Overcooked/pgct_overcooked).
# Without installation every entry point adds <repo>/PGCT to sys.path itself (RWARE/latent_team/_pgct_path.py,
# Overcooked/pgct_overcooked/__init__.py); RWARE scripts keep running from the RWARE folder as before.
[tool.setuptools.packages.find]
where = ["PGCT", "Overcooked"]
include = ["pgct_core*", "pgct_overcooked*"]
# Tests: run each suite from its own folder (scripts/run_tests.ps1): PGCT/tests, RWARE/tests, Overcooked/tests.
